oom-grid">${[...groups].sort((a,b)=>a[0].localeCompare(b[0],"ru")).map(([room,items])=>`<section class="dispatch-room"><h2>Кабинет ${esc(room)}</h2><div class="dispatch-room-body">${items.sort((a,b)=>(a.date+a.number).localeCompare(b.date+b.number)).map(row=>`<div class="dispatch-room-item"><time>${dateLabel(row.date)}<br>урок ${esc(row.number)}<br>${esc(row.time)}</time><div><b>${esc(row.lesson)}</b><small>${esc(row.weekday)} · ${esc(row.class||"ДО / консультация")} · ${esc(row.teacher||"без учителя")}</small></div></div>`).join("")}</div></section>`).join("")}</div>`}function render(){const rows=filtered();renderMetrics(rows);renderDay(rows);renderSlot(rows);renderRoom(rows)}function options(){$("filter-date").innerHTML='<option value="">Все даты</option>'+unique("date").map(value=>`<option value="${esc(value)}">${dateLabel(value)}</option>`).join("");$("filter-slot").innerHTML='<option value="">Все уроки</option>'+unique("number").map(value=>`<option value="${esc(value)}">Урок ${esc(value)}</option>`).join("");$("filter-room").innerHTML='<option value="">Все кабинеты</option>'+unique("room").map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join("")}function activate(mode){document.querySelectorAll('.mode-panel').forEach(panel=>panel.classList.toggle('active',panel.id===`panel-${mode}`));document.querySelectorAll('.dispatcher-tabs label').forEach(label=>label.classList.toggle('active',label.htmlFor===`mode-${mode}`))}$("mode-day").onchange=()=>activate("day");$("mode-slot").onchange=()=>activate("slot");$("mode-room").onchange=()=>activate("room");["filter-date","filter-slot","filter-room","filter-query"].forEach(id=>$(id).addEventListener("input",render));$("reset").onclick=()=>{["filter-slot","filter-room","filter-query"].forEach(id=>$(id).value="");$("filter-date").value="";render()};options();activate("day");render();</script></body></html>
