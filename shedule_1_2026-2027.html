<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Расписание лицея 2026-2027</title>
<style>
:root {
  --ink: #14231f;
  --ink-soft: #56625e;
  --paper: #f4f1e9;
  --paper-2: #ebe6db;
  --panel: #fffdf7;
  --line: #d6d0c2;
  --green: #123f38;
  --green-2: #1f6358;
  --coral: #e36049;
  --coral-dark: #a93d2d;
  --blue: #2d6593;
  --violet: #74538f;
  --amber: #c57a1e;
  --sage: #5d7b65;
  --shadow: 0 18px 45px rgba(31, 43, 38, .13);
  --radius: 18px;
  --slot-width: 104px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  overflow-x: hidden;
  color: var(--ink);
  background:
    radial-gradient(circle at 7% 5%, rgba(227, 96, 73, .12), transparent 24rem),
    linear-gradient(180deg, #f8f5ee 0, var(--paper) 36rem);
  font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
  font-size: 15px;
}
button, input, select { font: inherit; }
button { color: inherit; }
.topline { height: 6px; background: linear-gradient(90deg, var(--coral) 0 29%, var(--green) 29% 78%, #dbb85f 78%); }
.masthead {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 28px;
  align-items: end;
  padding: 34px clamp(18px, 4vw, 64px) 26px;
  color: #f8f5ec;
  background: var(--green);
  position: relative;
  overflow: hidden;
}
.masthead::after {
  content: "";
  position: absolute;
  width: 420px;
  height: 420px;
  right: -120px;
  top: -250px;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 50%;
  box-shadow: 0 0 0 54px rgba(255, 255, 255, .025), 0 0 0 108px rgba(255, 255, 255, .02);
}
.masthead > * { min-width: 0; }
.eyebrow {
  margin: 0 0 8px;
  color: #d8c998;
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  max-width: 900px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(2rem, 5vw, 4.8rem);
  font-weight: 500;
  line-height: .94;
  letter-spacing: -.045em;
}
.masthead-note { margin: 15px 0 0; max-width: 760px; color: #c9d8d2; line-height: 1.55; }
.validity {
  position: relative;
  z-index: 1;
  min-width: 190px;
  padding: 15px 18px;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(8px);
}
.validity strong { display: block; color: #dcf0c7; font-size: .9rem; }
.validity span { display: block; margin-top: 3px; color: #bfd0ca; font-size: .76rem; }
.nav-shell {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding: 10px clamp(12px, 4vw, 64px);
  border-bottom: 1px solid var(--line);
  background: rgba(244, 241, 233, .94);
  backdrop-filter: blur(16px);
  scrollbar-width: thin;
}
.nav-button {
  flex: 0 0 auto;
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  background: transparent;
  cursor: pointer;
  font-weight: 700;
  transition: .18s ease;
}
.nav-button:hover { background: var(--paper-2); }
.nav-button[aria-selected="true"] { color: #fff; background: var(--green); }
.page { padding: 26px clamp(12px, 4vw, 64px) 64px; }
.stats {
  display: grid;
  grid-template-columns: repeat(5, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.stat {
  min-width: 0;
  min-height: 104px;
  padding: 17px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255,253,247,.82);
}
.stat-label { color: var(--ink-soft); font-size: .75rem; font-weight: 750; letter-spacing: .055em; overflow-wrap: anywhere; text-transform: uppercase; }
.stat-value { display: block; margin-top: 9px; font-family: Georgia, serif; font-size: 2rem; line-height: 1; }
.stat-note { display: block; margin-top: 6px; color: var(--ink-soft); font-size: .75rem; }
.toolbar {
  display: grid;
  grid-template-columns: minmax(190px, 1.5fr) minmax(170px, 1fr) minmax(130px, .7fr) minmax(130px, .7fr) minmax(120px, .6fr) auto;
  gap: 9px;
  align-items: end;
  margin-bottom: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: 0 7px 24px rgba(44, 52, 48, .05);
}
.control { min-width: 0; }
.control label { display: block; margin: 0 0 6px 3px; color: var(--ink-soft); font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.control input, .control select {
  width: 100%;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 0 12px;
  color: var(--ink);
  background: #fff;
  outline: none;
}
.control input:focus, .control select:focus { border-color: var(--green-2); box-shadow: 0 0 0 3px rgba(31, 99, 88, .12); }
.tool-button {
  height: 42px;
  border: 1px solid var(--green);
  border-radius: 11px;
  padding: 0 14px;
  color: var(--green);
  background: transparent;
  cursor: pointer;
  font-weight: 750;
}
.tool-button:hover { color: #fff; background: var(--green); }
.filter-status { grid-column: 1 / -1; min-height: 18px; padding: 0 3px; color: var(--ink-soft); font-size: .78rem; }
.view { display: none; }
.view.active { display: block; animation: appear .18s ease-out; }
@keyframes appear { from { opacity: .25; transform: translateY(3px); } }
.section-head {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: flex-end;
  margin: 0 0 12px;
}
.section-head h2 { margin: 0; font-family: Georgia, serif; font-size: clamp(1.65rem, 3vw, 2.65rem); font-weight: 500; letter-spacing: -.025em; }
.section-head p { margin: 5px 0 0; max-width: 760px; color: var(--ink-soft); line-height: 1.45; }
.legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 12px; color: var(--ink-soft); font-size: .75rem; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; }
.dot-inperson { background: var(--green-2); }
.dot-online { background: var(--blue); }
.dot-async { background: var(--violet); }
.dot-elective { background: var(--coral); }
.dot-extra { background: var(--amber); }
.entity-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 12px;
}
.summary-pill {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-soft);
  background: var(--panel);
  font-size: .78rem;
}
.summary-pill strong { color: var(--ink); }
.table-wrap {
  position: relative;
  overflow: auto;
  max-height: calc(100vh - 160px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  overscroll-behavior: contain;
}
table { border-collapse: separate; border-spacing: 0; }
.overview-table { width: max-content; min-width: 100%; font-size: .7rem; }
.overview-table th, .overview-table td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.overview-table thead th {
  position: sticky;
  z-index: 9;
  color: #f8f5ec;
  background: var(--green);
}
.overview-table thead tr:first-child th { top: 0; }
.overview-table thead tr:nth-child(2) th { top: 35px; }
.overview-table .corner {
  left: 0;
  z-index: 14;
  min-width: 118px;
  padding: 0 12px;
  text-align: left;
  vertical-align: middle;
}
.day-heading { height: 35px; padding: 0 8px; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.slot-heading { width: var(--slot-width); min-width: var(--slot-width); height: 47px; padding: 4px; }
.slot-heading span { display: block; margin-top: 2px; color: #bcd0c9; font-size: .58rem; font-weight: 400; }
.unit-heading {
  position: sticky;
  left: 0;
  z-index: 6;
  width: 118px;
  min-width: 118px;
  padding: 8px 11px;
  border-right: 2px solid var(--green) !important;
  text-align: left;
  color: var(--green);
  background: #f6f2e8;
  font-size: .85rem;
}
.overview-cell {
  width: var(--slot-width);
  min-width: var(--slot-width);
  height: 64px;
  padding: 3px;
  vertical-align: top;
  background: #fffefb;
}
.overview-cell.online-day { background: #eef5f7; }
.overview-cell.slot-zero { background-image: repeating-linear-gradient(135deg, rgba(116,83,143,.04) 0 7px, rgba(116,83,143,.09) 7px 8px); }
.overview-table tbody tr:hover .overview-cell { background-color: #fbf7ec; }
.day-edge { border-right: 3px solid #a7b3ae !important; }
.event-card {
  display: block;
  width: 100%;
  margin: 0 0 3px;
  border: 0;
  border-left: 4px solid var(--green-2);
  border-radius: 7px;
  padding: 5px 6px;
  overflow: hidden;
  text-align: left;
  color: var(--ink);
  background: #e8f1ec;
  cursor: pointer;
  box-shadow: 0 1px 0 rgba(20,35,31,.08);
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.event-card:hover, .event-card:focus-visible { z-index: 2; transform: translateY(-1px); box-shadow: 0 5px 13px rgba(20,35,31,.15); outline: none; }
.event-card.online { border-color: var(--blue); background: #e6f0f8; }
.event-card.async { border-color: var(--violet); background: #f0eaf5; }
.event-card.elective { border-color: var(--coral); background: #fae8e1; }
.event-card.extra { border-color: var(--amber); background: #fff0d7; }
.event-card.logistics { border-color: var(--sage); background: #e7eee7; }
.event-card.class-hour { border-color: #a37c31; background: #f6edcd; }
.event-card.unresolved { box-shadow: inset 0 0 0 1px rgba(169,61,45,.45); }
.event-subject { display: block; overflow: hidden; font-weight: 780; line-height: 1.15; text-overflow: ellipsis; }
.event-meta { display: block; margin-top: 3px; overflow: hidden; color: #4e5d58; font-size: .62rem; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
.overview-cell .event-card { padding: 4px 5px; }
.overview-cell .event-subject { max-height: 2.3em; font-size: .66rem; }
.overview-cell .event-meta { font-size: .56rem; }
.empty-mark { display: block; padding-top: 18px; color: #c7c2b8; text-align: center; }
.week-table { width: 100%; min-width: 860px; table-layout: fixed; }
.week-table th, .week-table td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.week-table thead th { position: sticky; top: 0; z-index: 4; height: 50px; padding: 6px; color: #fff; background: var(--green); }
.week-table thead th:first-child { width: 112px; }
.week-table td { height: 82px; padding: 5px; vertical-align: top; background: #fffefb; }
.week-table td.online-day { background: #eef5f7; }
.week-table td.slot-zero { background-color: #f8f3fa; }
.time-cell { padding: 9px !important; color: var(--ink-soft); background: #f2eee4 !important; }
.time-cell strong { display: block; color: var(--ink); font-size: 1rem; }
.time-cell span { font-size: .65rem; }
.week-table .event-card { padding: 7px 8px; }
.week-table .event-subject { font-size: .78rem; }
.week-table .event-meta { font-size: .66rem; }
.mobile-days { display: none; }
.tooltip {
  position: fixed;
  z-index: 100;
  display: none;
  width: min(430px, calc(100vw - 24px));
  max-height: min(620px, calc(100vh - 24px));
  overflow: auto;
  padding: 15px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 15px;
  color: #f8f5ec;
  background: rgba(14, 36, 31, .97);
  box-shadow: 0 18px 54px rgba(0,0,0,.28);
  pointer-events: none;
}
.tooltip.visible { display: block; }
.tooltip .detail-label { color: #9ebbb2; }
.tooltip .detail-chip { border-color: rgba(255,255,255,.2); color: #f8f5ec; background: rgba(255,255,255,.08); }
.tooltip .detail-block { border-color: rgba(255,255,255,.14); }
.detail-title { margin: 0 0 5px; font-family: Georgia, serif; font-size: 1.35rem; font-weight: 500; line-height: 1.1; }
.detail-id { color: #9eb0aa; font-size: .7rem; font-weight: 700; letter-spacing: .08em; }
.detail-grid { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 7px 10px; margin-top: 13px; font-size: .82rem; }
.detail-label { color: var(--ink-soft); font-weight: 700; }
.detail-value { min-width: 0; overflow-wrap: anywhere; }
.detail-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.detail-chip { padding: 3px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: .72rem; }
.detail-block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .78rem; line-height: 1.45; }
.detail-block strong { display: block; margin-bottom: 4px; }
.drawer-backdrop { position: fixed; inset: 0; z-index: 110; display: none; background: rgba(9, 24, 21, .42); }
.drawer-backdrop.open { display: block; }
.drawer {
  position: fixed;
  z-index: 111;
  top: 0;
  right: 0;
  width: min(510px, 100vw);
  height: 100vh;
  padding: 25px;
  overflow: auto;
  border-left: 1px solid var(--line);
  background: var(--panel);
  box-shadow: -20px 0 60px rgba(13,35,30,.2);
  transform: translateX(102%);
  transition: transform .22s ease;
}
.drawer.open { transform: translateX(0); }
.drawer-close { float: right; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; font-size: 1.2rem; }
.drawer-close:hover { color: #fff; background: var(--green); }
.drawer-content { padding-top: 58px; }
.audit-hero {
  display: grid;
  grid-template-columns: minmax(220px,.8fr) minmax(0,2.2fr);
  gap: 14px;
  margin-bottom: 18px;
}
.audit-verdict { padding: 25px; border-radius: var(--radius); color: #f7f4eb; background: var(--green); }
.audit-verdict strong { display: block; margin-top: 11px; font-family: Georgia, serif; font-size: 2.4rem; font-weight: 500; }
.audit-verdict p { margin: 8px 0 0; color: #bfd0ca; line-height: 1.5; }
.checks-grid { display: grid; grid-template-columns: repeat(3, minmax(170px,1fr)); gap: 8px; }
.check-card { padding: 13px 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
.check-card .check-state { float: right; color: var(--green-2); font-weight: 900; }
.check-card.failed .check-state { color: var(--coral-dark); }
.check-card strong { display: block; padding-right: 24px; font-size: .82rem; }
.check-card span { display: block; margin-top: 6px; color: var(--ink-soft); font-size: .7rem; }
.audit-columns { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(280px,.6fr); gap: 14px; }
.audit-panel { min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.audit-panel h3 { margin: 0 0 5px; font-family: Georgia, serif; font-size: 1.45rem; font-weight: 500; }
.audit-panel .panel-note { margin: 0 0 14px; color: var(--ink-soft); font-size: .78rem; }
.audit-toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
.audit-toolbar select { height: 38px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; background: #fff; }
.preference-list { max-height: 620px; overflow: auto; border-top: 1px solid var(--line); }
.preference-row { display: grid; grid-template-columns: 120px minmax(180px,.9fr) minmax(220px,1.2fr) 86px; gap: 10px; align-items: start; padding: 11px 5px; border-bottom: 1px solid var(--line); font-size: .77rem; }
.preference-row.unmet { background: #fff9f0; }
.pref-teacher { font-weight: 800; }
.pref-detail { color: var(--ink-soft); }
.pref-state { justify-self: end; padding: 3px 7px; border-radius: 999px; color: var(--green); background: #e3efe8; font-size: .68rem; font-weight: 800; }
.preference-row.unmet .pref-state { color: var(--coral-dark); background: #fae5dd; }
.hard-mark { color: var(--coral-dark); font-weight: 800; }
.warning-list { display: grid; gap: 8px; max-height: 360px; overflow: auto; }
.warning-item { padding: 10px; border-left: 4px solid var(--amber); border-radius: 8px; background: #fff6e5; font-size: .75rem; line-height: 1.4; }
.assumption-list { margin: 0; padding: 0; list-style: none; counter-reset: assumptions; }
.assumption-list li { counter-increment: assumptions; position: relative; padding: 9px 0 9px 32px; border-bottom: 1px solid var(--line); color: var(--ink-soft); font-size: .76rem; line-height: 1.45; }
.assumption-list li::before { content: counter(assumptions); position: absolute; left: 0; top: 8px; width: 23px; height: 23px; border-radius: 50%; color: #fff; background: var(--green-2); text-align: center; line-height: 23px; font-size: .66rem; }
.provenance { margin-top: 14px; padding: 13px; border-radius: 11px; background: var(--paper); color: var(--ink-soft); font-family: Consolas, monospace; font-size: .67rem; line-height: 1.55; overflow-wrap: anywhere; }
.notice { padding: 14px; border: 1px solid #e2c080; border-radius: 12px; color: #76501a; background: #fff5df; line-height: 1.45; }
.no-results { padding: 28px; color: var(--ink-soft); text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 1060px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  .toolbar { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .audit-columns { grid-template-columns: 1fr; }
  .checks-grid { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 720px) {
  .masthead { grid-template-columns: 1fr; padding-top: 26px; }
  .validity { width: fit-content; }
  .page { padding-top: 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat { min-height: 90px; padding: 14px; }
  .toolbar { grid-template-columns: repeat(2, minmax(0,1fr)); padding: 11px; }
  .toolbar .control:first-child, .filter-status { grid-column: 1 / -1; }
  .section-head { display: block; }
  .legend { justify-content: flex-start; margin-top: 10px; }
  .week-table { display: none; }
  .mobile-days { display: grid; gap: 12px; }
  .mobile-day { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .mobile-day h3 { margin: 0; padding: 10px 13px; color: #fff; background: var(--green); font-size: .86rem; }
  .mobile-event-row { display: grid; grid-template-columns: 77px minmax(0,1fr); gap: 7px; padding: 8px; border-bottom: 1px solid var(--line); }
  .mobile-event-row:last-child { border-bottom: 0; }
  .mobile-time { color: var(--ink-soft); font-size: .65rem; }
  .mobile-time strong { display: block; color: var(--ink); font-size: .82rem; }
  .audit-hero { grid-template-columns: 1fr; }
  .checks-grid { grid-template-columns: 1fr 1fr; }
  .preference-row { grid-template-columns: 92px minmax(0,1fr) 68px; }
  .pref-detail { grid-column: 1 / -1; }
  .drawer { padding: 18px; }
}
@media (max-width: 470px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stat-value { font-size: 1.65rem; }
  .toolbar { grid-template-columns: 1fr; }
  .toolbar .control:first-child, .filter-status { grid-column: auto; }
  .tool-button { width: 100%; }
  .checks-grid { grid-template-columns: 1fr; }
}
@media print {
  @page { size: landscape; margin: 7mm; }
  body { background: #fff; font-size: 9px; }
  .topline, .nav-shell, .stats, .toolbar, .legend, .tooltip, .drawer, .drawer-backdrop { display: none !important; }
  .masthead { padding: 10px 0; color: #000; background: #fff; }
  .masthead::after, .masthead-note, .validity { display: none; }
  h1 { font-size: 26px; }
  .page { padding: 0; }
  .view:not(.active) { display: none !important; }
  .table-wrap { overflow: visible; max-height: none; border: 0; box-shadow: none; }
  .overview-table { width: 100%; table-layout: fixed; font-size: 4px; }
  .overview-table .corner, .overview-table .unit-heading { width: 34px; min-width: 34px; }
  .overview-table .slot-heading, .overview-cell { width: auto; min-width: 0; }
  .overview-cell { height: 28px; padding: 1px; }
  .event-card { padding: 1px; border-left-width: 1px; box-shadow: none; }
  .event-meta { display: none; }
}
</style>
</head>
<body>
<div class="topline"></div>
<header class="masthead">
  <div>
    <p class="eyebrow">Лицей · учебный год 2026—2027</p>
    <h1>Расписание без скрытых конфликтов</h1>
    <p class="masthead-note">Единая интерактивная сетка для классов, преподавателей и аудиторий. Наведите на любое занятие для подробностей или нажмите, чтобы закрепить карточку.</p>
  </div>

  try { return new Intl.DateTimeFormat("ru-RU", {dateStyle:"long", timeStyle:"short"}).format(new Date(value)); }
  catch (_) { return value; }
};

for (const event of EVENTS) {
  const optionText = (event.options || []).flatMap(option => [option.course, option.teacher, ...(option.eligible_units || [])]);
  event._search = [event.id, event.subject, event.day, event.delivery, event.category, event.location, event.notes, ...event.units, ...event.teachers, ...event.rooms, ...optionText]
    .join(" ").toLocaleLowerCase("ru");
}

function eventClass(event) {
  if (event.delivery === "онлайн") return "online";
  if (event.delivery === "дистант") return "async";
  if (event.category === "электив") return "elective";
  if (event.category === "внеурочка") return "extra";
  if (event.category === "логистика") return "logistics";
  if (event.category === "классный час") return "class-hour";
  return "inperson";
}

function matches(event) {
  if (state.query && !event._search.includes(state.query)) return false;
  if (state.delivery && event.delivery !== state.delivery) return false;
  if (state.category && event.category !== state.category) return false;
  if (state.day && event.day !== state.day) return false;
  return true;
}

function roomText(event) {
  return event.rooms.length ? event.rooms.join(", ") : "не указано";
}

function unitGroups(event, unit) {
  const groups = unique(event.segments.filter(segment => segment.unit === unit).map(segment => segment.group));
  if (!groups.length || groups.includes("весь класс")) return "";
  return groups.map(group => group.replace("группа ", "гр. ")).join(" + ");
}

function eventMeta(event, context, entity) {
  if (context === "unit") {
    return [unitGroups(event, entity), event.teachers.join(", "), roomText(event)].filter(Boolean).join(" · ");
  }
  if (context === "teacher") return [event.units.join(", "), roomText(event)].filter(Boolean).join(" · ");
  if (context === "room") return [event.units.join(", "), event.teachers.join(", ")].filter(Boolean).join(" · ");
  const groups = unique(event.segments.map(segment => segment.group)).filter(group => group !== "весь класс");
  return [groups.join("/"), event.teachers.join(", ")].filter(Boolean).join(" · ");
}

function eventCard(event, context, entity) {
  const warning = event.rooms.some(unresolved);
  return `<button type="button" class="event-card ${eventClass(event)}${warning ? " unresolved" : ""}" data-event-id="${escapeHtml(event.id)}" aria-label="${escapeHtml(event.subject + ", " + event.day + " слот " + event.start_slot)}">
    <span class="event-subject">${escapeHtml(event.subject)}</span>
    <span class="event-meta">${escapeHtml(eventMeta(event, context, entity))}</span>
  </button>`;
}

function chips(items) {
  return `<div class="detail-chips">${items.map(item => `<span class="detail-chip">${escapeHtml(item)}</span>`).join("")}</div>`;
}

function detailMarkup(event) {
  const segmentLines = event.segments.map(segment => `${segment.unit}: ${segment.subject}, ${segment.group}${segment.category !== event.category ? `, ${segment.category}` : ""}`);
  const roomLines = (event.room_assignments || []).map(item => `${item.label}${item.teacher ? ` · ${item.teacher}` : ""} → ${item.room}`);
  const optionBlock = (event.options || []).length ? `<div class="detail-block"><strong>Опции блока</strong>${event.options.map(option => `<div>${escapeHtml(option.course)} · ${escapeHtml(option.teacher)}<br><span class="detail-label">Доступно:</span> ${escapeHtml((option.eligible_units || []).join(", "))}</div>`).join("<br>")}</div>` : "";
  const notes = event.notes ? `<div class="detail-block"><strong>Комментарий модели</strong>${escapeHtml(event.notes)}</div>` : "";
  return `<div class="detail-id">${escapeHtml(event.id)} · ${event.plan_item ? "учебный план" : "техническое событие"}</div>
    <h3 class="detail-title">${escapeHtml(event.subject)}</h3>
    <div class="detail-grid">
      <div class="detail-label">Когда</div><div class="detail-value"><strong>${escapeHtml(event.day)}, слот ${event.slots.join("–")}</strong><br>${escapeHtml(event.time)}</div>
      <div class="detail-label">Формат</div><div class="detail-value">${chips([event.delivery, event.category, `${event.duration} ч.`])}</div>
      <div class="detail-label">Классы</div><div class="detail-value">${chips(event.units)}</div>
      <div class="detail-label">Учителя</div><div class="detail-value">${chips(event.teachers.length ? event.teachers : ["не указан"])}</div>
      <div class="detail-label">Место</div><div class="detail-value">${escapeHtml(event.location)}<br>${roomLines.map(escapeHtml).join("<br>") || escapeHtml(roomText(event))}</div>
      <div class="detail-label">Состав</div><div class="detail-value">${segmentLines.map(escapeHtml).join("<br>")}</div>
    </div>${optionBlock}${notes}`;
}

function getDays() { return state.day ? [state.day] : DAYS; }

function eventsForEntity(type, entity) {
  if (type === "classes") return EVENTS.filter(event => event.units.includes(entity));
  if (type === "teachers") return EVENTS.filter(event => event.teachers.includes(entity));
  if (type === "rooms") return EVENTS.filter(event => event.rooms.includes(entity));
  return EVENTS;
}

function eventsAt(source, day, slot) {
  return source.filter(event => event.day === day && event.slots.includes(slot) && matches(event));
}

function legend() {
  return `<div class="legend" aria-label="Легенда">
    <span class="legend-item"><i class="legend-dot dot-inperson"></i>очно</span>
    <span class="legend-item"><i class="legend-dot dot-online"></i>онлайн</span>
    <span class="legend-item"><i class="legend-dot dot-async"></i>дистант</span>
    <span class="legend-item"><i class="legend-dot dot-elective"></i>электив</span>
    <span class="legend-item"><i class="legend-dot dot-extra"></i>внеурочка</span>
  </div>`;
}

function sectionHead(title, note) {
  return `<div class="section-head"><div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(note)}</p></div>${legend()}</div>`;
}

function renderOverview() {
  const days = getDays();
  let html = sectionHead("Общее сводное расписание", "20 учебных юнитов в одной сетке. Горизонтальная прокрутка сохраняет заголовки дней и названия классов.");
  html += `<div class="entity-summary"><span class="summary-pill"><strong>${days.length}</strong> дн.</span><span class="summary-pill"><strong>${DATA.units.length}</strong> юнитов</span><span class="summary-pill">Слот 0: асинхронные занятия</span><span class="summary-pill">Голубой фон: онлайн-день класса</span></div>`;
  html += `<div class="table-wrap"><table class="overview-table"><thead><tr><th class="corner" rowspan="2">Класс</th>`;
  for (const day of days) html += `<th class="day-heading" colspan="${SLOTS.length}">${escapeHtml(day)}</th>`;
  html += `</tr><tr>`;
  for (const day of days) {
    for (const slot of SLOTS) html += `<th class="slot-heading${slot === SLOTS.at(-1) ? " day-edge" : ""}">${slot}<span>${escapeHtml(DATA.calendar.slots[String(slot)])}</span></th>`;
  }
  html += `</tr></thead><tbody>`;
  for (const unit of DATA.units) {
    const source = EVENTS.filter(event => event.units.includes(unit));
    html += `<tr><th class="unit-heading">${escapeHtml(unit)}</th>`;
    for (const day of days) {
      for (const slot of SLOTS) {
        const cell = eventsAt(source, day, slot);
        const classes = [DATA.calendar.online_days[unit] === day ? "online-day" : "", slot === 0 ? "slot-zero" : "", slot === SLOTS.at(-1) ? "day-edge" : ""].filter(Boolean).join(" ");
        html += `<td class="overview-cell ${classes}">${cell.map(event => eventCard(event, "unit", unit)).join("")}</td>`;
      }
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  $("#view-overview").innerHTML = html;
}

function entitySummary(type, entity, source) {
  const filtered = source.filter(matches);
  const live = filtered.filter(event => event.delivery !== "дистант");
  const hours = filtered.reduce((sum, event) => sum + event.duration, 0);
  const days = unique(live.map(event => event.day));
  let pills = `<span class="summary-pill"><strong>${filtered.length}</strong> событий</span><span class="summary-pill"><strong>${hours}</strong> ч.</span><span class="summary-pill">Рабочие дни: <strong>${days.join(", ") || "нет"}</strong></span>`;
  if (type === "classes") pills += `<span class="summary-pill">Онлайн-день: <strong>${escapeHtml(DATA.calendar.online_days[entity] || "нет")}</strong></span>`;
  if (type === "teachers") {
    const metric = DATA.audit.teacher_metrics[entity];
    if (metric) pills += `<span class="summary-pill">Свободные дни: <strong>${escapeHtml(metric.free_days.join(", ") || "нет")}</strong></span><span class="summary-pill">Окна учителя: <strong>${metric.gap_count}</strong></span>`;
  }
  if (type === "rooms") {
    const pending = unresolved(entity);
    pills += `<span class="summary-pill">Статус: <strong>${pending ? "требует назначения" : "назначено"}</strong></span>`;
  }
  return `<div class="entity-summary">${pills}</div>`;
}

function renderWeek(type, entity) {
  const source = eventsForEntity(type, entity);
  const days = getDays();
  const cardContext = type === "classes" ? "unit" : type.slice(0, -1);
  const titles = {classes:"Расписание класса", teachers:"Расписание учителя", rooms:"Занятость кабинета"};
  const notes = {
    classes:"Подгруппы показываются параллельными карточками внутри одного слота.",
    teachers:"Онлайн и очные занятия находятся в одной хронологической сетке; дистант отмечен отдельно.",
    rooms:"Для элективных блоков показано занятие, использующее выбранную аудиторию. Платформы и места вне лицея включены как отдельные ресурсы.",
  };
  let html = sectionHead(`${titles[type]}: ${entity}`, notes[type]);
  html += entitySummary(type, entity, source);
  if (type === "rooms" && unresolved(entity)) html += `<p class="notice">Это не назначенный кабинет, а очередь ручного подбора. Откройте карточки, чтобы увидеть преподавателя и конкретную опцию.</p>`;
  html += `<div class="table-wrap"><table class="week-table"><thead><tr><th>Слот</th>${days.map(day => `<th>${escapeHtml(day)}</th>`).join("")}</tr></thead><tbody>`;
  for (const slot of SLOTS) {
    html += `<tr><td class="time-cell"><strong>${slot}</strong><span>${escapeHtml(DATA.calendar.slots[String(slot)])}</span></td>`;
    for (const day of days) {
      const cell = eventsAt(source, day, slot);
      const onlineDay = type === "classes" && DATA.calendar.online_days[entity] === day;
      html += `<td class="${onlineDay ? "online-day " : ""}${slot === 0 ? "slot-zero" : ""}">${cell.length ? cell.map(event => eventCard(event, cardContext, entity)).join("") : `<span class="empty-mark">·</span>`}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div><div class="mobile-days">`;
  for (const day of days) {
    const dayEvents = source.filter(event => event.day === day && matches(event)).sort((a,b) => a.start_slot - b.start_slot || a.id.localeCompare(b.id));
    html += `<section class="mobile-day"><h3>${escapeHtml(day)}</h3>`;
    if (!dayEvents.length) html += `<div class="no-results">Нет занятий</div>`;
    for (const event of dayEvents) html += `<div class="mobile-event-row"><div class="mobile-time"><strong>Слот ${event.slots.join("–")}</strong>${escapeHtml(event.time)}</div><div>${eventCard(event, cardContext, entity)}</div></div>`;
    html += `</section>`;
  }
  html += `</div>`;
  $(`#view-${type}`).innerHTML = html;
}

const CHECK_NAMES = {
  plan_coverage:"Покрытие учебного плана", event_integrity:"Целостность событий", elective_options:"Опции элективов",
  student_windows:"Окна у подгрупп", student_overlaps:"Пересечения учеников", teacher_overlaps:"Пересечения учителей",
  room_overlaps:"Пересечения кабинетов", online_days:"Онлайн-дни", daily_subject_limit:"Лимит предмета в день",
  two_hour_subject_spread:"Разведение двух часов", fixed_slots:"Фиксированные позиции", elective_blocks:"Правила после блоков",
  hard_teacher_preferences:"Жёсткие пожелания", room_44:"Кабинет 44",
};

function renderAudit() {
  const audit = DATA.audit;
  const preferences = audit.preferences;
  const checks = Object.entries(audit.checks).map(([key, value]) => `<div class="check-card ${value.ok ? "" : "failed"}"><span class="check-state">${value.ok ? "✓" : "!"}</span><strong>${escapeHtml(CHECK_NAMES[key] || key)}</strong><span>${escapeHtml(Object.entries(value).filter(([name]) => name !== "ok").map(([name,val]) => `${name}: ${val}`).join(" · ") || "нарушений нет")}</span></div>`).join("");
  const roomWarnings = (audit.warnings || []).flatMap(warning => warning.type === "rooms_to_assign" ? warning.items : []);
  let html = `<div class="section-head"><div><h2>Аудит и пожелания</h2><p>Жёсткая корректность отделена от мягкого качества. Невыполненное пожелание не скрывается и не называется конфликтом.</p></div></div>`;
  html += `<div class="audit-hero"><div class="audit-verdict"><span>Результат автоматической проверки</span><strong>${audit.valid ? "Валидно" : "Есть конфликты"}</strong><p>${audit.hard_conflict_count} жёстких конфликтов. Проверено ${fmtNumber(DATA.plan.total_unit_group_hours)} часов учебного плана.</p></div><div class="checks-grid">${checks}</div></div>`;
  html += `<div class="audit-columns"><section class="audit-panel"><h3>Пожелания преподавателей</h3><p class="panel-note">Выполнено ${preferences.met} из ${preferences.evaluated} измеримых пунктов; жёстких ${preferences.hard_met} из ${preferences.hard_evaluated}.</p><div class="audit-toolbar"><label class="sr-only" for="preference-filter">Фильтр пожеланий</label><select id="preference-filter"><option value="all">Все пожелания</option><option value="unmet">Только невыполненные</option><option value="hard">Только жёсткие</option><option value="met">Только выполненные</option></select></div><div class="preference-list" id="preference-list"></div></section>`;
  html += `<div><section class="audit-panel"><h3>Кабинеты к назначению</h3><p class="panel-note">${roomWarnings.length} назначений оставлены для ручного выбора; это предупреждения, не конфликты.</p><div class="warning-list">${roomWarnings.length ? roomWarnings.map(item => `<button type="button" class="warning-item event-card unresolved" data-event-id="${escapeHtml(item.event)}"><strong>${escapeHtml(item.event)} · ${escapeHtml(item.subject)}</strong><br>${escapeHtml(item.day)}, слоты ${escapeHtml(item.slots.join("–"))} · ${escapeHtml(item.teacher || "учитель не указан")}<br>${escapeHtml(item.room)}</button>`).join("") : `<div class="notice">Все кабинеты назначены.</div>`}</div></section>`;
  html += `<section class="audit-panel" style="margin-top:14px"><h3>Допущения модели</h3><p class="panel-note">Явные решения для неоднозначных мест исходного задания.</p><ol class="assumption-list">${DATA.assumptions.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ol><div class="provenance"><strong>Сформировано:</strong> ${escapeHtml(formatGenerated(DATA.meta.generated_at))}<br><strong>Solver:</strong> ${escapeHtml(DATA.meta.solver)} · ${escapeHtml(DATA.meta.solver_status)}<br><strong>Objective:</strong> ${escapeHtml(DATA.meta.objective_value)} · bound ${escapeHtml(DATA.meta.best_bound)}<br><strong>source SHA-256:</strong> ${escapeHtml(DATA.meta.source_sha256)}<br><strong>model SHA-256:</strong> ${escapeHtml(DATA.meta.model_sha256)}<br><strong>generator SHA-256:</strong> ${escapeHtml(DATA.meta.generator_sha256)}</div></section></div></div>`;
  $("#view-audit").innerHTML = html;
  renderPreferenceList("all");
  $("#preference-filter").addEventListener("change", event => renderPreferenceList(event.target.value));
}

function renderPreferenceList(filter) {
  const target = $("#preference-list");
  if (!target) return;
  const items = DATA.audit.preferences.items.filter(item => {
    if (state.query && ![item.teacher, item.wish, item.detail, item.priority].join(" ").toLocaleLowerCase("ru").includes(state.query)) return false;
    if (filter === "unmet") return item.evaluated && !item.met;
    if (filter === "hard") return item.hard;
    if (filter === "met") return item.met;
    return true;
  });
  target.innerHTML = items.length ? items.map(item => `<div class="preference-row ${item.met ? "" : "unmet"}"><div class="pref-teacher">${escapeHtml(item.teacher)}${item.hard ? `<br><span class="hard-mark">жёстко</span>` : ""}</div><div>${escapeHtml(item.wish)}<br><span class="detail-label">${escapeHtml(item.priority)}</span></div><div class="pref-detail">${escapeHtml(item.detail)}</div><span class="pref-state">${item.met ? "выполнено" : item.evaluated ? "не выполнено" : "не оценено"}</span></div>`).join("") : `<div class="no-results">По фильтру ничего не найдено</div>`;
}

function renderStats() {
  const roomWarnings = (DATA.audit.warnings || []).find(item => item.type === "rooms_to_assign");
  const unresolvedCount = roomWarnings ? roomWarnings.count : 0;
  const preferences = DATA.audit.preferences;
  const values = [
    [DATA.audit.hard_conflict_count, "Жёсткие конфликты", DATA.audit.valid ? "автоматический аудит пройден" : "требуется исправление"],
    [DATA.plan.total_unit_group_hours, "Часы плана", "покрытие 100%"],
    [EVENTS.length, "События", `${DATA.units.length} учебных юнитов`],
    [unresolvedCount, "Подбор кабинетов", "ручные назначения"],
    [`${preferences.met}/${preferences.evaluated}`, "Пожелания", `${preferences.not_met} компромиссов`],
  ];
  $("#stats").innerHTML = values.map(([value,label,note]) => `<div class="stat"><span class="stat-label">${escapeHtml(label)}</span><strong class="stat-value">${escapeHtml(typeof value === "number" ? fmtNumber(value) : value)}</strong><span class="stat-note">${escapeHtml(note)}</span></div>`).join("");
  $("#validity").innerHTML = `<strong>${DATA.audit.valid ? "✓ Жёсткие правила соблюдены" : "! Найдены конфликты"}</strong><span>${escapeHtml(formatGenerated(DATA.meta.generated_at))}</span>`;
}

function populateStaticFilters() {
  const category = $("#category-filter");
  for (const value of unique(EVENTS.map(event => event.category)).sort((a,b) => a.localeCompare(b,"ru"))) category.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`);
  const day = $("#day-filter");
  for (const value of DAYS) day.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`);
}

function updateEntityControl() {
  const config = {
    classes: ["Класс", DATA.units],
    teachers: ["Учитель", DATA.teachers],
    rooms: ["Кабинет / ресурс", DATA.rooms],
  }[state.view];
  const wrapper = $("#entity-control");
  if (!config) { wrapper.hidden = true; return; }
  wrapper.hidden = false;
  $("#entity-label").textContent = config[0];
  const select = $("#entity-select");
  select.innerHTML = config[1].map(value => `<option value="${escapeHtml(value)}"${value === state.entities[state.view] ? " selected" : ""}>${escapeHtml(value)}</option>`).join("");
}

function renderActive() {
  if (state.view === "overview") renderOverview();
  else if (["classes","teachers","rooms"].includes(state.view)) renderWeek(state.view, state.entities[state.view]);
  else renderAudit();
  const count = EVENTS.filter(matches).length;
  $("#filter-status").textContent = `Фильтрам соответствуют ${count} из ${EVENTS.length} событий${state.query ? ` · запрос «${state.query}»` : ""}`;
}

function setView(view) {
  state.view = view;
  $$(".nav-button").forEach(button => button.setAttribute("aria-selected", String(button.dataset.view === view)));
  $$(".view").forEach(panel => panel.classList.toggle("active", panel.dataset.view === view));
  updateEntityControl();
  renderActive();
  history.replaceState(null, "", `#${view}`);
}

function showTooltip(button) {
  const event = EVENT_BY_ID.get(button.dataset.eventId);
  if (!event || window.matchMedia("(hover: none)").matches) return;
  const tooltip = $("#tooltip");
  tooltip.innerHTML = detailMarkup(event);
  tooltip.classList.add("visible");
  const rect = button.getBoundingClientRect();
  const gap = 10;
  const width = tooltip.offsetWidth;
  const height = tooltip.offsetHeight;
  let left = rect.right + gap;
  if (left + width > window.innerWidth - gap) left = rect.left - width - gap;
  left = Math.max(gap, Math.min(left, window.innerWidth - width - gap));
  let top = rect.top;
  if (top + height > window.innerHeight - gap) top = window.innerHeight - height - gap;
  tooltip.style.left = `${Math.max(gap,left)}px`;
  tooltip.style.top = `${Math.max(gap,top)}px`;
}

function hideTooltip() { $("#tooltip").classList.remove("visible"); }

function openDrawer(eventId) {
  const event = EVENT_BY_ID.get(eventId);
  if (!event) return;
  hideTooltip();
  $("#drawer-content").innerHTML = detailMarkup(event);
  $("#drawer").classList.add("open");
  $("#drawer-backdrop").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false");
  $("#drawer-close").focus();
}

function closeDrawer() {
  $("#drawer").classList.remove("open");
  $("#drawer-backdrop").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
}

document.addEventListener("mouseover", event => { const button = event.target.closest("[data-event-id]"); if (button) showTooltip(button); });
document.addEventListener("mouseout", event => { if (event.target.closest("[data-event-id]")) hideTooltip(); });
document.addEventListener("focusin", event => { const button = event.target.closest("[data-event-id]"); if (button) showTooltip(button); });
document.addEventListener("focusout", event => { if (event.target.closest("[data-event-id]")) hideTooltip(); });
document.addEventListener("click", event => { const button = event.target.closest("[data-event-id]"); if (button) openDrawer(button.dataset.eventId); });
document.addEventListener("keydown", event => { if (event.key === "Escape") closeDrawer(); });
$$(".nav-button").forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));
$("#search").addEventListener("input", event => { state.query = event.target.value.trim().toLocaleLowerCase("ru"); renderActive(); });
$("#delivery-filter").addEventListener("change", event => { state.delivery = event.target.value; renderActive(); });
$("#category-filter").addEventListener("change", event => { state.category = event.target.value; renderActive(); });
$("#day-filter").addEventListener("change", event => { state.day = event.target.value; renderActive(); });
$("#entity-select").addEventListener("change", event => { state.entities[state.view] = event.target.value; renderActive(); });
$("#print-button").addEventListener("click", () => window.print());
