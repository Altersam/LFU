const DAYS = DATA.days, SLOTS = DATA.slots;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const KIND_NAME = {'очно': 'Очный урок', 'онлайн': 'Онлайн-урок', 'дистант': 'Дистант (самостоятельно)',
  'электив': 'Элективный курс', 'внеурочка': 'Внеурочная деятельность', 'технопарк': 'Выезд в технопарк',
  'классный час': 'Классный час'};

function tipHtml(e, mode, d, s) {
  let t = '<span class="tt-s">' + esc(e.subj) + '</span><br>';
  t += '<span class="tt-k">' + esc(KIND_NAME[e.kind] || e.kind) + '</span>';
  t += '<span class="tt-d"> · ' + d + ', урок ' + s + ' (' + DATA.times[String(s)] + ')</span>';
  if (e.options) {
    t += '<br><span class="tt-d">Варианты на выбор:</span>';
    for (const o of e.options) t += '<br>• ' + esc(o[0]) + (o[1] ? ' — ' + esc(o[1]) : '');
  } else {
    if (mode === 'classes' && e.teachers && e.teachers.length)
      t += '<br><span class="tt-d">Учитель:</span> ' + esc(e.teachers.join(' / '));
    if (mode === 'teachers' && e.unit)
      t += '<br><span class="tt-d">Класс:</span> ' + esc(e.unit);
    if (e.group) t += '<br><span class="tt-d">Подгруппа:</span> ' + esc(e.group);
    if (e.flow && e.units) t += '<br><span class="tt-d">Поток:</span> ' + esc(e.units.join(', '));
  }
  return t;
}

function cellHtml(entries, mode, d, s) {
  if (!entries || !entries.length) return '<td class="cell"></td>';
  let h = '<td class="cell">';
  for (const e of entries) {
    const tip = ' data-tip="' + esc(tipHtml(e, mode, d, s)).replace(/"/g, '&quot;') + '"';
    if (e.options) {
      h += '<span class="elect"' + tip + '><b>' + esc(e.subj) + '</b>';
      for (const o of e.options) h += '<span>• ' + esc(o[0]) + (o[1] ? ' — ' + esc(o[1]) : '') + '</span>';
      h += '</span>';
    } else {
      const yellow = (e.color === '#facc15' || e.color === '#67e8f9' || e.color === '#fbbf24' || e.color === '#fca5a5' || e.color === '#5eead4' || e.color === '#93c5fd' || e.color === '#94a3b8' || e.color === '#9ca3af') ? ' yellow' : '';
      h += '<span class="sub' + yellow + '"' + tip + ' style="background:' + e.color + '">';
      const tag = DATA.kindTag[e.kind];
      if (tag) h += '<span class="tag">' + tag + '</span>';
      h += '<span class="ab">' + esc(e.abbr) + '</span>';
      if (mode === 'classes') {
        if (e.teachers && e.teachers.length)
          h += '<span class="who">' + esc(e.teachers.join(' / ')) + (e.group ? '<span class="grp">гр.' + e.group + '</span>' : '') + '</span>';
        if (e.flow) h += '<span class="flow">' + (e.units.length > 3 ? ('поток: ' + e.units.length + ' классов') : ('поток: ' + esc(e.units.join(', ')))) + '</span>';
      } else {
        h += '<span class="who">' + esc(e.unit) + (e.group ? '<span class="grp">гр.' + e.group + '</span>' : '') + '</span>';
      }
      h += '</span>';
    }
  }
  return h + '</td>';
}

// ---- подсчёт уроков и кабинетов по столбцам (день, слот)
function columnStats(source, keyFn) {
  const stats = {};
  const seen = new Set();
  for (const name of Object.keys(source)) {
    for (const d of DAYS) for (const s of SLOTS) {
      const ents = source[name][d + '_' + s];
      if (!ents) continue;
      const k0 = d + '_' + s;
      if (!stats[k0]) stats[k0] = {lessons: 0, rooms: 0};
      for (const e of ents) {
        if (e.options) {
          for (const o of e.options) {
            const sig = k0 + '|' + o[0] + '|' + (o[1] || '');
            if (seen.has(sig)) continue; seen.add(sig);
            stats[k0].lessons++;
            if (e.kind !== 'онлайн' && e.kind !== 'дистант') stats[k0].rooms++;
          }
        } else {
          const sig = k0 + '|' + e.subj + '|' + (e.teachers || []).slice().sort().join(',') + '|' + e.kind + '|' + (e.group || '');
          if (seen.has(sig)) continue; seen.add(sig);
          stats[k0].lessons++;
          if (e.kind !== 'онлайн' && e.kind !== 'дистант' && e.kind !== 'технопарк') stats[k0].rooms++;
        }
      }
    }
  }
  return stats;
}

function statRows(stats, withRooms) {
  let h = '<tr class="statname"><td>Уроков</td>';
  for (const d of DAYS) for (const s of SLOTS) {
    const st = stats[d + '_' + s];
    h += '<td class="statc">' + (st && st.lessons ? '<b>' + st.lessons + '</b>' : '') + '</td>';
  }
  h += '</tr>';
  if (withRooms) {
    h += '<tr class="statname"><td>Кабинетов</td>';
    for (const d of DAYS) for (const s of SLOTS) {
      const st = stats[d + '_' + s];
      h += '<td class="statc">' + (st && st.rooms ? '<b>' + st.rooms + '</b>' : '') + '</td>';
    }
    h += '</tr>';
  }
  return h;
}

function tableHtml(rows, mode) {
  let h = '<table class="tt"><tr><th class="name" rowspan="2">' + (mode === 'classes' ? 'Класс' : 'Учитель') + '</th>';
  for (const d of DAYS) h += '<th class="day" colspan="' + SLOTS.length + '">' + d + '</th>';
  h += '</tr><tr>';
  for (const d of DAYS)
    for (const s of SLOTS)
      h += '<th class="slot">' + s + '<small>' + DATA.times[String(s)] + '</small></th>';
  h += '</tr>';
  for (const name of rows) {
    h += '<tr><td class="rowname">' + esc(name) + '</td>';
    for (const d of DAYS)
      for (const s of SLOTS)
        h += cellHtml(DATA.grid[name] ? DATA.grid[name][d + '_' + s] : null, mode, d, s);
    h += '</tr>';
  }
  h += statRows(columnStats(DATA.grid), true);
  return h + '</table>';
}

function teacherTableHtml() {
  const rows = Object.keys(DATA.teachers).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase(), 'ru'));
  let h = '<table class="tt"><tr><th class="name" rowspan="2">Учитель</th>';
  for (const d of DAYS) h += '<th class="day" colspan="' + SLOTS.length + '">' + d + '</th>';
  h += '</tr><tr>';
  for (const d of DAYS)
    for (const s of SLOTS)
      h += '<th class="slot">' + s + '<small>' + DATA.times[String(s)] + '</small></th>';
  h += '</tr>';
  for (const t of rows) {
    h += '<tr><td class="rowname">' + esc(t) + '</td>';
    for (const d of DAYS)
      for (const s of SLOTS) {
        const ents = DATA.teachers[t][d + '_' + s];
        h += cellHtml(ents, 'teachers', d, s);
      }
    h += '</tr>';
  }
  // статистика по учителям: дедуп по предмет+класс
  const seen = new Set(), stats = {};
  for (const t of Object.keys(DATA.teachers)) {
    for (const d of DAYS) for (const s of SLOTS) {
      const ents = DATA.teachers[t][d + '_' + s];
      if (!ents) continue;
      const k0 = d + '_' + s;
      if (!stats[k0]) stats[k0] = {lessons: 0, rooms: 0};
      for (const e of ents) {
        const sig = k0 + '|' + e.subj + '|' + (e.unit || '') + '|' + e.kind;
        if (seen.has(sig)) continue; seen.add(sig);
        stats[k0].lessons++;
      }
    }
  }
  h += statRows(stats, false);
  return h + '</table>';
}

  let h = '<h2>Обозначения предметов</h2><div class="legend">';
  for (const li of DATA.legend)
    h += '<span class="li"><span class="sw" style="background:' + li[1] + '"></span><b>' + esc(li[0]) + '</b>&nbsp;' + esc(li[2]) + '</span>';
  h += '</div><h2>Виды занятий (метка в углу ячейки)</h2><div class="kinds">' +
    '<b>ОН</b> онлайн &nbsp; <b>Д</b> дистант (слот 0) &nbsp; <b>Э</b> электив &nbsp; ' +
    '<b>В</b> внеурочка (слоты 8–9) &nbsp; <b>Т</b> технопарк &nbsp; РоВ — «Разговоры о важном» (Пн, 1-й урок)</div>' +
    '<h2>Онлайн-дни классов</h2><div class="kinds">' +
    Object.keys(DATA.onlineDay).map(u => u + ': ' + DATA.onlineDay[u]).join(' · ') + ' · 8А, 8Б: нет</div>';
  return h;
}

function roomsHtml() {
  let h = '<h2>Занятость кабинетов (по типам помещений)</h2>';
  h += '<div class="kinds">Красным выделены пересечения (&gt;1 урока в кабинете в одном слоте — недопустимо для кабинета информатики). ' +
       'Пик обычных кабинетов (одновременных очных уроков без спецкабинетов): <b>' + DATA.peakRegular + '</b></div>';
  for (const rt of Object.keys(DATA.rooms)) {
    h += '<div class="dayhead">' + esc(rt) + '</div>';
    h += '<table class="tt"><tr><th class="nameslot">День</th>';
    for (const s of SLOTS) h += '<th class="slot">' + s + '<small>' + DATA.times[String(s)] + '</small></th>';
    h += '</tr>';
    for (const d of DAYS) {
      h += '<tr><td class="rowname">' + d + '</td>';
      for (const s of SLOTS) {
        const users = DATA.rooms[rt][d + '_' + s];
        if (users && users.length) {
          const bad = users.length > 1 && rt.indexOf('(1)') >= 0;
          h += '<td class="cell"' + (bad ? ' style="background:#fecaca"' : ' style="background:#dcfce7"') + '>';
          for (const x of users) h += '<span class="sub" style="background:' + (bad ? '#dc2626' : '#16a34a') + ';font-size:7.5px;display:block">' + esc(x) + '</span>';
          h += '</td>';
        } else {
          h += '<td class="cell"></td>';
        }
      }
      h += '</tr>';
    }
    h += '</table>';
  }
  return h;
}

document.getElementById('view-rooms').innerHTML = roomsHtml();
document.getElementById('view-legend').innerHTML = legendHtml();

// ---- липкая шапка: подгонка отступов под реальную высоту заголовков
function fixSticky() {
  const root = document.documentElement;
  const hdr = document.querySelector('header');
  if (hdr) root.style.setProperty('--hdr', hdr.offsetHeight + 'px');
  const dayTh = document.querySelector('#view-classes th.day');
  if (dayTh) root.style.setProperty('--dayh', dayTh.offsetHeight + 'px');
}
window.addEventListener('load', fixSticky);
window.addEventListener('resize', fixSticky);
fixSticky();

// ---- тултип при наведении
const tipEl = document.getElementById('tooltip');
document.addEventListener('mouseover', function(ev) {
  const el = ev.target.closest ? ev.target.closest('[data-tip]') : null;
  if (!el) { tipEl.style.display = 'none'; return; }
  tipEl.innerHTML = el.getAttribute('data-tip');
  tipEl.style.display = 'block';
});
document.addEventListener('mousemove', function(ev) {
  if (tipEl.style.display !== 'block') return;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > window.innerHeight - 8) y = ev.clientY - h - 14;
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
});
document.addEventListener('mouseout', function(ev) {
  const to = ev.relatedTarget;
  if (!to || !to.closest || !to.closest('[data-tip]')) tipEl.style.display = 'none';
});

function showView(v) {
  for (const x of ['classes', 'teachers', 'rooms', 'legend']) {
    document.getElementById('view-' + x).style.display = (x === v) ? '' : 'none';
    document.getElementById('tab-' + x).classList.toggle('active', x === v);
  }
  location.hash = v;
}
if (location.hash === '#teachers') showView('teachers');
if (location.hash === '#rooms') showView('rooms');
if (location.hash === '#legend') showView('legend');
</script>
